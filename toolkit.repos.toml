# ============================================================================
# Project Toolkit — External Repository Registry (machine-readable)
# ============================================================================
# Human-readable catalog: TOOLKIT.md
# Fetch any of these on demand:   python3 tools/toolkit.py clone <name|tag|category|all>
# List what's available:          python3 tools/toolkit.py list
#
# - Repos are cloned SHALLOW into .toolkit/<category>/<name>/ (gitignored — never commit them).
# - tags: "core" = default starter set; free-form role tags after that.
# - Verify licenses before commercial use (AGPL items noted — network-service caveat).
# ============================================================================

[meta]
updated = "2026-09-23"
source_doc = "TOOLKIT.md"
clone_dir = ".toolkit"

